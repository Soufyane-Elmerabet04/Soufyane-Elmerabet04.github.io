      --text: #0C2A3F;
      --muted: #4A6478;
      --line: #DCEBF5;
      --line-strong: #B7D3E6;

      /* Sky-blue gradients */
      --btn-bg: linear-gradient(135deg, #0284C7 0%, #0369A1 100%);

      --grad-deep: linear-gradient(155deg, #0369A1 0%, #075985 50%, #0C4A6E 100%);
      --grad-cta: linear-gradient(135deg, #0284C7 0%, #075985 55%, #0C4A6E 100%);
      --grad-text: linear-gradient(120deg, #0C4A6E 0%, #0284C7 100%);
      --grad-dot: linear-gradient(135deg, #38BDF8 0%, #0369A1 100%);
      --glow: rgba(56, 189, 248, .22);

      --on-navy: #EAF6FE;
      --on-navy-muted: #CFE9F8;
      --accent: #38BDF8;
      --accent-soft: #7DD3FC;
      --accent-ink: #082F49;

      --display: "Sora", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

        --surface: #0D2233;
        --text: #E6F3FB;
        --muted: #9DB8CB;
        --line: #163247;
        --line-strong: #2A4A62;
        --link: #7DD3FC;
        --btn-bg: linear-gradient(135deg, #BAE6FD 0%, #38BDF8 100%);
        --btn-ink: #082F49;
        --grad-deep: linear-gradient(155deg, #075985 0%, #0C4A6E 55%, #082F49 100%);
        --grad-cta: linear-gradient(135deg, #0369A1 0%, #0C4A6E 55%, #082F49 100%);
        --grad-text: linear-gradient(120deg, #E0F2FE 0%, #38BDF8 100%);
        --glow: rgba(56, 189, 248, .14);

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

    body {

      background: var(--page);

    h1, h2, h3, p { margin: 0; }
    a { color: var(--link); }

    .ico { display: inline-flex; flex: none; }
    .ico svg { width: 1.15em; height: 1.15em; display: block; }

    .skip { position: absolute; left: 1rem; top: -4rem; z-index: 20; padding: .6rem 1rem; background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; border-radius: 6px; }
    .skip:focus { top: 1rem; }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
      padding: .75rem 1.3rem; border: 1.5px solid transparent; border-radius: 8px;
      font: 600 1rem/1.2 var(--font); text-decoration: none; cursor: pointer;
      transition: filter .15s, border-color .15s, background-color .15s;
    }
    .btn-primary { background: var(--btn-bg); color: var(--btn-ink); }
    .btn-primary:hover { filter: brightness(1.12); }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--line-strong); }
    .btn-ghost:hover { border-color: var(--link); }
    .btn-sky { background: linear-gradient(135deg, #E0F2FE 0%, #38BDF8 100%); color: var(--accent-ink); }
    .btn-sky:hover { filter: brightness(1.06); }
    .btn-line { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .4); }
    .btn-line:hover { border-color: #fff; background: rgba(255, 255, 255, .08); }
    .btn-sm { padding: .55rem 1rem; font-size: .975rem; }

    /* ---------- Layout ---------- */
    @media (min-width: 1024px) {
      .layout { display: grid; grid-template-columns: 22rem minmax(0, 1fr); min-height: 100vh; }
      .panel { position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    }

    /* ---------- Profile panel ---------- */
    .panel {
      display: flex; flex-direction: column; gap: 2rem;
      padding: 2.5rem 2rem;
      background: var(--grad-deep); color: var(--on-navy);
    }
    .panel :focus-visible { outline-color: #fff; }

    .avatar {
      width: 7.75rem; height: 7.75rem; padding: 4px; border-radius: 50%;
      background: linear-gradient(135deg, #FFFFFF 0%, #7DD3FC 50%, #38BDF8 100%);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
    .initials {
      width: 100%; height: 100%; display: grid; place-items: center; border-radius: 50%;
      background: linear-gradient(135deg, #075985 0%, #0C4A6E 100%); color: var(--accent-soft);
      font: 700 2.2rem/1 var(--display);

    .pname { margin-top: 1.5rem; font: 700 1.7rem/1.15 var(--display); letter-spacing: -.02em; color: #fff; }
    .prole { margin-top: .4rem; font-size: 1.1rem; color: var(--on-navy); }
    .pmeta { display: flex; flex-direction: column; gap: .35rem; margin-top: 1rem; font-size: 1rem; color: var(--on-navy-muted); }
    .pmeta > span { display: flex; align-items: center; gap: .55rem; }
    .dot { width: .6rem; height: .6rem; margin: 0 .275rem; border-radius: 50%; background: #BAF7D0; box-shadow: 0 0 0 3px rgba(186, 247, 208, .25); flex: none; }

    .pnav { display: flex; flex-direction: column; }
    .pnav a {
      display: flex; align-items: center; gap: 1rem; padding: .55rem 0;
      color: var(--on-navy-muted); text-decoration: none; font-weight: 600;
      transition: color .2s;
    }
    .pnav a::before {
      content: ""; width: 1.25rem; height: 2px; background: currentColor; opacity: .5;
      transition: width .25s, background-color .25s, opacity .25s;
    }
    .pnav a:hover { color: #fff; }
    .pnav a[aria-current="location"] { color: #fff; }
    .pnav a[aria-current="location"]::before { width: 2.75rem; background: #fff; opacity: 1; }

    .pfoot { display: flex; flex-direction: column; gap: 1.25rem; margin-top: auto; }
    .socials { display: flex; gap: .6rem; flex-wrap: wrap; }
    .socials a {
      width: 2.6rem; height: 2.6rem; display: grid; place-items: center; border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .35); color: #fff; font-size: 1.05rem;
      transition: background-color .15s, border-color .15s;
    }
    .socials a:hover { background: rgba(255, 255, 255, .14); border-color: #fff; }

    @media (max-width: 1023px) {
      .panel { padding: 2rem 1.25rem; gap: 1.5rem; }
      .pnav { flex-direction: row; flex-wrap: wrap; gap: .1rem 1.5rem; }
      .pnav a::before { display: none; }
      .pnav a[aria-current="location"] { color: var(--accent-soft); }
      .pfoot { margin-top: 0; }

    /* ---------- Content ---------- */
    .content {
      padding-inline: clamp(1.25rem, 5vw, 4.5rem);
      background: radial-gradient(52rem 26rem at 78% -3rem, var(--glow), transparent 70%) no-repeat;
    }
    .inner { min-width: 0; }
    .block { max-width: 50rem; margin-inline: auto; padding-block: clamp(3rem, 7vw, 5rem); }
    .block + .block { border-top: 1px solid var(--line); }
    .inner > h2:not(.headline) { margin-bottom: 2rem; font: 700 1.9rem/1.2 var(--display); letter-spacing: -.02em; }

    /* Hero */
    .hero { padding-top: clamp(2.5rem, 8vw, 6rem); }
    @media (prefers-reduced-motion: no-preference) {

    }
    .headline {
      max-width: 20ch; font: 700 clamp(2.2rem, 5.2vw, 3.6rem)/1.1 var(--display); letter-spacing: -.03em;
      background: var(--grad-text); -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      padding-bottom: .1em;
    }
    .lead { margin-top: 1.5rem; max-width: 46ch; font-size: 1.25rem; color: var(--muted); }
    .cta-row { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 2rem; }

    /* Projects */
    .project + .project { margin-top: 4rem; }
    .frame { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
    .frame-bar { display: flex; align-items: center; gap: .4rem; padding: .65rem .85rem; border-bottom: 1px solid var(--line); }
    .frame-bar i { width: .6rem; height: .6rem; border-radius: 50%; background: var(--line-strong); }
    .frame-url {
      flex: 1; max-width: 20rem; margin-left: .75rem; padding: .1rem .8rem; border-radius: 999px;
      background: var(--page); color: var(--muted); font-size: .85rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .frame img { display: block; width: 100%; height: auto; }
    .frame-fallback {
      display: grid; place-items: center; aspect-ratio: 16 / 10; padding: 1.5rem; text-align: center;
      background: linear-gradient(135deg, #38BDF8 0%, #0284C7 45%, #0C4A6E 100%);
      color: #fff; font: 700 clamp(1.5rem, 4vw, 2.6rem)/1.1 var(--display); letter-spacing: -.02em;

    .project-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-top: 1.5rem; }
    .project h3 { font: 700 1.5rem/1.25 var(--display); letter-spacing: -.015em; }
    .when { color: var(--muted); font-size: 1rem; white-space: nowrap; }
    .project .desc { margin-top: .6rem; max-width: 60ch; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: .45rem; margin: 1.1rem 0 0; padding: 0; list-style: none; }
    .chips li {
      padding: .2rem .7rem; border-radius: 6px; border: 1px solid var(--line);
      background: var(--surface); color: var(--link); font-size: .925rem; font-weight: 600;
    }
    .project .actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.4rem; }

    /* Experience timeline */
    .timeline { list-style: none; margin: 0; padding: 0 0 0 1.75rem; border-left: 2px solid var(--line-strong); }
    .job { position: relative; padding-bottom: 2.75rem; }
    .job:last-child { padding-bottom: 0; }
    .job::before {
      content: ""; position: absolute; left: calc(-1.75rem - 7px); top: .5rem;
      width: 12px; height: 12px; border-radius: 50%; background: var(--grad-dot); box-shadow: 0 0 0 4px var(--page);
    }
    .job h3 { font: 700 1.2rem/1.3 var(--display); letter-spacing: -.01em; }
    .job .co { margin-top: .1rem; font-weight: 600; }
    .job .co a { color: inherit; text-underline-offset: .2em; }
    .job .when { display: block; margin-top: .1rem; }
    .job ul { margin: .9rem 0 0; padding-left: 1.15rem; max-width: 60ch; color: var(--muted); }
    .job li + li { margin-top: .35rem; }

    /* About */
    .about-text p { max-width: 60ch; }
    .about-text p + p { margin-top: 1.1rem; }
    .skill-groups { display: grid; gap: 1.75rem; margin-top: 2.5rem; }
    .skill-groups h3 { font: 700 1rem/1.3 var(--display); }
    .skill-groups .chips { margin-top: .6rem; }

    /* Contact */
    .cta-box {
      padding: clamp(1.75rem, 5vw, 3.25rem); border-radius: 16px;
      background: var(--grad-cta); color: var(--on-navy);
    }
    .cta-box :focus-visible { outline-color: #fff; }
    .cta-box h2 { margin: 0; font: 700 clamp(1.8rem, 4vw, 2.5rem)/1.15 var(--display); letter-spacing: -.025em; color: #fff; max-width: 18ch; }
    .cta-box p { margin-top: 1rem; max-width: 46ch; color: var(--on-navy-muted); }
    .cta-box .cta-row { margin-top: 1.75rem; }

    .foot { max-width: 50rem; margin-inline: auto; padding-block: 2rem 3rem; color: var(--muted); font-size: .95rem; border-top: 1px solid var(--line); }
  </style>
</head>

      x: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.200 2.300h3.300l-7.200 8.300 8.500 11.200h-6.700l-5.200-6.800-6 6.800H1.700l7.700-8.800L1.300 2.300h6.800l4.700 6.200 5.400-6.200zm-1.200 17.500h1.800L7.100 4.100H5.100l11.900 15.700z"/></svg>',
      mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
      globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
      pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.200 7-11a7 7 0 1 0-14 0c0 4.800 7 11 7 11z"/><circle cx="12" cy="10" r="2.500"/></svg>',
      download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>'
    };

    function icon(name) {
      const s = document.createElement("span");
      s.className = "ico";
      s.setAttribute("aria-hidden", "true");
      s.innerHTML = ICONS[name] || ICONS.globe;   // static, trusted strings only
      return s;
    }

    function el(tag, attrs = {}, ...kids) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k === "class") node.className = v; else node.setAttribute(k, v);
      }
      for (const kid of kids.flat()) {
        if (kid == null || kid === false) continue;
        node.append(kid.nodeType ? kid : document.createTextNode(kid));
      }
      return node;
    }

    const isExternal = (u) => /^https?:\/\//i.test(u);
    const extAttrs = (u) => isExternal(u) ? { target: "_blank", rel: "noopener noreferrer" } : {};

    function guessIcon(l) {
      if (l.icon) return l.icon;
      const k = (l.label + " " + l.url).toLowerCase();
      if (k.includes("github")) return "github";
      if (k.includes("linkedin")) return "linkedin";
      if (k.includes("twitter") || k.includes("x.com")) return "x";
      if (k.includes("mailto") || k.includes("mail")) return "mail";
      return "globe";
    }

    /* ---- Head + profile panel ---- */
    document.title = `${site.name} | ${site.role}`;
    $("pname").textContent = site.name;
    $("prole").textContent = site.role;

    const initials = site.name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
    const showInitials = () => $("avatar").replaceChildren(el("span", { class: "initials", "aria-hidden": "true" }, initials));
    if (site.photo) {
      const img = el("img", { src: site.photo, alt: `Photo of ${site.name}`, width: 240, height: 240, decoding: "async" });
      img.onerror = showInitials;
      $("avatar").append(img);
    } else showInitials();

    if (site.location) { $("ploc").append(icon("pin"), site.location); $("ploc").hidden = false; }
    if (site.status) { $("pstatus").append(el("i", { class: "dot" }), site.status); $("pstatus").hidden = false; }

    (site.links || []).forEach((l) => {
      $("socials").append(el("a", { href: l.url, "aria-label": l.label, title: l.label, ...extAttrs(l.url) }, icon(guessIcon(l))));
    });
    if (site.email) {
      $("socials").append(el("a", { href: `mailto:${site.email}`, "aria-label": "Email", title: "Email" }, icon("mail")));
    }
    if (site.resume) {
      const cv = $("cv");
      cv.href = site.resume;
      cv.setAttribute("download", "");
      cv.append(icon("download"), "Download CV");
      cv.hidden = false;
    }

    /* ---- Hero ---- */
    $("headline").textContent = site.headline;
    $("lead").textContent = site.intro;

    /* ---- Projects ---- */
    function hostOf(p) {
      const live = (p.links || []).find((x) => /live|demo|site|visit/i.test(x.label) && isExternal(x.url));
      if (live) { try { return new URL(live.url).hostname.replace(/^www\./, ""); } catch (e) {} }
      return p.title.toLowerCase().replace(/\s+/g, "-");
    }

    function frame(p) {
      const bar = el("div", { class: "frame-bar", "aria-hidden": "true" }, el("i"), el("i"), el("i"), el("span", { class: "frame-url" }, hostOf(p)));
      const fallback = () => el("div", { class: "frame-fallback", "aria-hidden": "true" }, p.title);
      let body;
      if (p.image) {
        body = el("img", { src: p.image.src, alt: p.image.alt || "", width: p.image.width, height: p.image.height, loading: "lazy", decoding: "async" });
        body.onerror = () => body.replaceWith(fallback());   // missing file: show placeholder
      } else body = fallback();
      return el("div", { class: "frame" }, bar, body);
    }

    const projects = site.projects || [];
    $("projects").hidden = projects.length === 0;
    projects.forEach((p) => {
      $("projects-list").append(el("article", { class: "project" },
        frame(p),
        el("div", { class: "project-head" }, el("h3", {}, p.title), p.year && el("span", { class: "when" }, p.year)),
        el("p", { class: "desc" }, p.description),
        p.tags && p.tags.length ? el("ul", { class: "chips" }, p.tags.map((t) => el("li", {}, t))) : null,
        p.links && p.links.length
          ? el("div", { class: "actions" }, p.links.map((l, i) =>
              el("a", { class: `btn btn-sm ${i === 0 ? "btn-primary" : "btn-ghost"}`, href: l.url, ...extAttrs(l.url) }, l.label)))
          : null
      ));
    });

    /* ---- Experience ---- */
    const jobs = site.experience || [];
    $("experience").hidden = jobs.length === 0;
    jobs.forEach((j) => {
      const company = j.url ? el("a", { href: j.url, ...extAttrs(j.url) }, j.company) : j.company;
      $("experience-list").append(el("li", { class: "job" },
        el("h3", {}, j.role),
        el("p", { class: "co" }, company),
        el("span", { class: "when" }, j.period),
        j.points && j.points.length ? el("ul", {}, j.points.map((x) => el("li", {}, x))) : null
      ));
    });

    /* ---- About + skills ---- */
    (site.about || []).forEach((t) => $("about-text").append(el("p", {}, t)));
    (site.skills || []).forEach((s) => {
      $("skills-list").append(el("div", {}, el("h3", {}, s.group), el("ul", { class: "chips" }, s.items.map((i) => el("li", {}, i)))));
    });
    $("about").hidden = !(site.about || []).length && !(site.skills || []).length;

    /* ---- Contact ---- */
    $("contact-h").textContent = site.contactTitle;
    $("contact-text").textContent = site.contactText;
    $("mail").href = `mailto:${site.email}`;
    $("mail").append(icon("mail"), "Email me");
    $("copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(site.email); }
      catch (e) {
        const t = el("textarea", { readonly: "" }); t.value = site.email;
        document.body.append(t); t.select();
        try { document.execCommand("copy"); } catch (_) {}
        t.remove();
      }
      $("copy-label").textContent = "Copied";
      setTimeout(() => ($("copy-label").textContent = "Copy address"), 2000);
    });

    /* ---- Footer ---- */
    $("footer").textContent = `\u00A9 ${new Date().getFullYear()} ${site.name}. Built with plain HTML, CSS and JavaScript.`;

    /* ---- Sidebar navigation with active-section marker ---- */
    const sections = [
      { id: "intro", label: "Intro" },
      { id: "projects", label: "Projects" },
      { id: "experience", label: "Experience" },
      { id: "about", label: "About" },
      { id: "contact", label: "Contact" }
    ].filter((s) => !$(s.id).hidden);

    sections.forEach((s) => $("pnav").append(el("a", { href: `#${s.id}` }, s.label)));
    const navLinks = [...$("pnav").children];
    const setCurrent = (id) => navLinks.forEach((a) =>
      a.getAttribute("href") === `#${id}` ? a.setAttribute("aria-current", "location") : a.removeAttribute("aria-current"));
    setCurrent(sections[0].id);

    if ("IntersectionObserver" in window) {
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => { if (e.isIntersecting) setCurrent(e.target.id); });
      }, { rootMargin: "-35% 0px -60% 0px" });
      sections.forEach((s) => io.observe($(s.id)));
    }
    if ($("projects").hidden) $("btn-projects").hidden = true;
  </script>
</body>
</html>
